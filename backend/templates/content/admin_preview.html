<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Превью витрины · LiveDev Admin</title>
  <style>
    :root {
      --bg: #070b16;
      --card: #0f1528;
      --line: rgba(255,255,255,.1);
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #2c7bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Manrope, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      display: flex; gap: 16px; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: rgba(7,11,22,.92); backdrop-filter: blur(8px); z-index: 5;
    }
    header a { color: var(--accent); text-decoration: none; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 24px; }
    .tab {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 999px; padding: 8px 14px; cursor: pointer;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); }
    .stage {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px;
      padding: 0 24px 40px; max-width: 1200px;
    }
    .visual {
      min-height: 360px; border-radius: 20px; border: 1px solid var(--line);
      background: #0a1020; overflow: hidden; position: relative;
    }
    .visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .copy { padding: 8px 4px; }
    .kicker { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
    h1 { margin: 8px 0 12px; font-size: 28px; }
    p { color: #c5d0ea; line-height: 1.5; }
    .points { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .points span {
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; color: var(--muted);
    }
    .nav { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
    .nav button {
      border: 1px solid var(--line); background: #131b31; color: var(--text);
      border-radius: 10px; padding: 10px 14px; cursor: pointer;
    }
    .empty { padding: 40px 24px; color: var(--muted); }
    @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>Превью витрины</strong>
      <div style="color:var(--muted);font-size:13px">Как увидит посетитель на сайте</div>
    </div>
    <div>
      <a href="/admin/content/showcaseitem/">← Карточки</a>
      ·
      <a href="/admin/">Админка</a>
    </div>
  </header>

  <div id="root" class="empty">Загрузка…</div>

  {{ showcase_json|json_script:"showcase-data" }}
  <script>
    const DATA = JSON.parse(document.getElementById('showcase-data').textContent);
    const root = document.getElementById('root');
    const slugs = Object.keys(DATA);
    if (!slugs.length) {
      root.innerHTML = '<div class="empty">Пока нет активных разделов/карточек. Добавьте в админке и обновите.</div>';
    } else {
      let cat = slugs[0];
      let idx = 0;
      const render = () => {
        const c = DATA[cat];
        const item = c.items[idx];
        root.innerHTML = `
          <div class="tabs">
            ${slugs.map(s => `<button class="tab ${s===cat?'active':''}" data-cat="${s}">${DATA[s].label}</button>`).join('')}
          </div>
          <div class="stage">
            <div class="visual">${item.image ? `<img src="${item.image}" alt="">` : '<div class="empty">Нет картинки</div>'}</div>
            <div class="copy">
              <div class="kicker">${c.label}</div>
              <h1>${item.title}</h1>
              <p>${item.text}</p>
              <div class="points">${(item.points||[]).map(p=>`<span>${p}</span>`).join('')}</div>
              <div class="nav">
                <button type="button" id="prev">←</button>
                <span>${idx+1} / ${c.items.length}</span>
                <button type="button" id="next">→</button>
              </div>
            </div>
          </div>`;
        root.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
          cat = btn.dataset.cat; idx = 0; render();
        }));
        root.querySelector('#prev').onclick = () => { idx = (idx - 1 + c.items.length) % c.items.length; render(); };
        root.querySelector('#next').onclick = () => { idx = (idx + 1) % c.items.length; render(); };
      };
      render();
    }
  </script>
</body>
</html>
